name: Actualizar tendencias de Vinted

on:
  schedule:
    # Principal: cada 3 horas (hora UTC). Se ejecuta en la nube, no necesita tu PC.
    - cron: '0 */3 * * *'
    # Red de seguridad: 45 min después, SOLO actualiza si la principal falló.
    - cron: '45 */3 * * *'
  workflow_dispatch:      # botón para ejecutarlo a mano

permissions:
  contents: write

# Evita que dos ejecuciones se solapen
concurrency:
  group: tendencias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buscar tendencias en Vinted
        run: |
          if [ "${{ github.event.schedule }}" = "45 */3 * * *" ]; then
            echo "🛟 Red de seguridad: solo actualizaré si los datos tienen más de 3 h"
            python3 scripts/tendencias.py --only-if-stale
          else
            python3 scripts/tendencias.py
          fi

      - name: Guardar y publicar los cambios
        run: |
          git config user.name "resellervinted-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -z "$(git status --porcelain public/trends.json)" ]; then
            echo "Sin cambios que guardar"
            exit 0
          fi

          # Guardamos el fichero recién generado y nos ponemos al día con la nube.
          # Así subimos SOLO nuestro archivo y evitamos conflictos con otros robots.
          cp public/trends.json /tmp/trends_generated.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/trends_generated.json public/trends.json
            git add public/trends.json
            if git diff --cached --quiet; then
              echo "Sin cambios respecto a la nube"; exit 0
            fi
            git commit -m "Tendencias $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "✅ Tendencias actualizadas"; exit 0
            fi
            echo "Reintento de push $i..."; sleep 5
          done
          echo "❌ No se pudo publicar"; exit 1
