name: Actualizar tendencias de Vinted

on:
  schedule:
    # Cada 3 horas (hora UTC). Se ejecuta en la nube, no necesita tu PC.
    - cron: '0 */3 * * *'
  workflow_dispatch:      # botón para ejecutarlo a mano

permissions:
  contents: write

# Evita que dos ejecuciones se solapen
concurrency:
  group: tendencias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Buscar tendencias en Vinted
        run: python3 scripts/tendencias.py

      - name: Guardar y publicar los cambios
        run: |
          git config user.name "resellervinted-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -z "$(git status --porcelain public/trends.json)" ]; then
            echo "Sin cambios que guardar"
            exit 0
          fi

          git add public/trends.json
          git commit -m "Tendencias $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Traer lo que haya en la nube y reintentar el push si hiciera falta
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push; then
              echo "✅ Tendencias actualizadas"; exit 0
            fi
            echo "Reintento de push $i..."; sleep 5
          done
          echo "❌ No se pudo publicar"; exit 1
