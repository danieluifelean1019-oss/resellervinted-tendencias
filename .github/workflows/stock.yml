name: Analizar mi stock

on:
  schedule:
    # Cada 3 horas (UTC), 20 min después del robot de tendencias para no solaparse.
    - cron: '20 */3 * * *'
  workflow_dispatch:      # botón para ejecutarlo a mano

permissions:
  contents: write

# Evita que dos ejecuciones del análisis de stock se solapen
concurrency:
  group: analisis-stock
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analizar mi stock frente al mercado de Vinted
        env:
          ROBOT_EMAIL: ${{ secrets.ROBOT_EMAIL }}
          ROBOT_PASS: ${{ secrets.ROBOT_PASS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python3 scripts/analizar_stock.py

      - name: Guardar y publicar los cambios
        run: |
          git config user.name "resellervinted-bot"
          git config user.email "actions@users.noreply.github.com"

          if [ -z "$(git status --porcelain public/stock_analysis.json)" ]; then
            echo "Sin cambios que guardar"
            exit 0
          fi

          # Guardamos el fichero recién generado y nos ponemos al día con la nube.
          # Así subimos SOLO nuestro archivo y evitamos conflictos con otros robots.
          cp public/stock_analysis.json /tmp/stock_generated.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/stock_generated.json public/stock_analysis.json
            git add public/stock_analysis.json
            if git diff --cached --quiet; then
              echo "Sin cambios respecto a la nube"; exit 0
            fi
            git commit -m "Stock $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push origin HEAD:main; then
              echo "✅ Análisis de stock actualizado"; exit 0
            fi
            echo "Reintento de push $i..."; sleep 5
          done
          echo "❌ No se pudo publicar"; exit 1
